[theme]
primaryColor = "#2196F3"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"
showSidebarNavigation = true

[logger]
level = "info"

[server]
maxUploadSize = 200
port = 8501
headless = true
runOnSave = true
